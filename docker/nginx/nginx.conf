user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream web {
    server web:3000;
  }

  upstream server {
    server server:4000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
      proxy_pass http://server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
