version: '3.9'
services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --dir apps/web dev"
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    volumes:
      - ..:/workspace

  server:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --dir apps/server dev"
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: ******postgres:5432/codesign
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ..:/workspace

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesign
      POSTGRES_USER: codesign
      POSTGRES_PASSWORD: codesign
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server

volumes:
  postgres-data:
  minio-data:
